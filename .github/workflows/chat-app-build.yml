name: Chat app build checks

on:
  push:
    branches:
      - main
      - fix/realtime-chat-foundation
  pull_request:
    branches:
      - main
      - fix/realtime-chat-foundation

jobs:
  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nestmadfilepath/ramesh-chat-app/client/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix Nestmadfilepath/ramesh-chat-app/client
      - name: Build frontend
        run: npm run build --prefix Nestmadfilepath/ramesh-chat-app/client

  server-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check backend JavaScript syntax
        run: find Nestmadfilepath/ramesh-chat-app/server -type f -name '*.js' -print0 | xargs -0 -n1 node --check
