<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="theme-color" content="#050505" />

    <meta name="color-scheme" content="dark" />

    <meta name="application-name" content="Black Pearl Chat" />

    <meta
      name="apple-mobile-web-app-title"
      content="Black Pearl Chat"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- SEO TITLE -->

    <title>
      BP Chat – Black Pearl Chat | Private Messaging & Audio Calls
    </title>

    <!-- SEO DESCRIPTION -->

    <meta
      name="description"
      content="BP Chat, also known as Black Pearl Chat, is a premium private messaging app for real-time chat, private conversations and audio calls with an elegant modern experience."
    />

    <meta
      name="author"
      content="Black Pearl Chat"
    />

    <meta
      name="publisher"
      content="Black Pearl Chat"
    />

    <!-- SEARCH ENGINE SETTINGS -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- CANONICAL -->

    <link
      rel="canonical"
      href="https://user-chat-woad.vercel.app/"
    />

    <!-- FAVICON -->

    <link
      rel="icon"
      type="image/x-icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <link
      rel="shortcut icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- MANIFEST -->

    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- OPEN GRAPH -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:site_name"
      content="Black Pearl Chat"
    />

    <meta
      property="og:title"
      content="BP Chat – Black Pearl Chat | Private Messaging & Audio Calls"
    />

    <meta
      property="og:description"
      content="Experience Black Pearl Chat — a premium private messaging platform for real-time conversations and audio calls."
    />

    <meta
      property="og:url"
      content="https://user-chat-woad.vercel.app/"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <meta
      property="og:image"
      content="https://user-chat-woad.vercel.app/logo512.png"
    />

    <meta
      property="og:image:alt"
      content="Black Pearl Chat private messaging and audio calling"
    />

    <!-- TWITTER / X -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="BP Chat – Black Pearl Chat | Private Messaging & Audio Calls"
    />

    <meta
      name="twitter:description"
      content="Private messaging, real-time chat and audio calls with the premium Black Pearl Chat experience."
    />

    <meta
      name="twitter:image"
      content="https://user-chat-woad.vercel.app/logo512.png"
    />

    <!-- PERFORMANCE -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="preconnect"
      href="https://cdnjs.cloudflare.com"
      crossorigin
    />

    <!-- FONT AWESOME -->

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      referrerpolicy="no-referrer"
    />

    <!-- POPPINS -->

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- LUXURY FONTS -->

    <link
      href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Text:wght@400;600;700&family=EB+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700;900&family=Playfair+Display:wght@400;500;600;700;800&display=swap"
